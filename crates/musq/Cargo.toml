[package]
name = "musq"
description = "Musq is an asynchronous SQLite toolkit for Rust."
readme = "../../README.md"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
default = ["vec", "time", "bstr", "json"]
vec = ["dep:sqlite-vec", "dep:bytemuck"]
time = ["dep:time"]
bstr = ["dep:bstr"]
json = ["dep:serde", "dep:serde_json"]

[dependencies]
musq-macros.workspace = true
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "rt",
    "sync",
    "time",
] }
time = { version = "0.3.55", optional = true, features = [
    "formatting",
    "macros",
    "parsing",
] }
bytes = "1.12.2"
crossbeam-queue = "0.3.14"
either = "1.19.0"
futures-core = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = [
    "alloc",
] }
async-stream = "0.3"
log = { version = "0.4.35", default-features = false }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
tracing = { version = "0.1.44", features = ["log"] }
bstr = { version = "1.14", optional = true, default-features = false, features = [
    "std",
] }
hashlink = "0.12"
indexmap = "2.14"
flume = "0.12"
libsqlite3-sys = { version = "0.40", default-features = false, features = [
    "bundled",
    "pkg-config",
    "vcpkg",
] }
sqlite-vec = { version = "0.1.9", optional = true }
bytemuck = { version = "1.25.2", optional = true }

[dev-dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["full"] }
paste = "1.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand = "0.10.4"
rand_xoshiro = "0.8.2"
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio"] }
trybuild = "1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[example]]
name = "custom_type"
required-features = ["json"]

[[example]]
name = "vec"
required-features = ["vec"]

[[bench]]
name = "benchmark"
harness = false
path = "../../benches/benchmark.rs"
